name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: secretary, POSTGRES_PASSWORD: secretary, POSTGRES_DB: secretary_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U secretary" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit & integration tests (embedded PGlite)
        run: pnpm test
      - name: Server integration tests against PostgreSQL 16
        run: pnpm --filter @secretary/server exec vitest run test/jobs.test.ts test/integrations-actions.test.ts
        env: { TEST_DATABASE_URL: postgres://secretary:secretary@localhost:5432/secretary_test }
      - run: pnpm --filter @secretary/web exec playwright install --with-deps chromium
      - name: End-to-end (desktop, tablet, mobile viewports)
        run: pnpm e2e
        env: { CI: '1' }
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secretary:ci .
