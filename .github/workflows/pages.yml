name: Legal pages
# Publishes a mirror of the public site to GitHub Pages (enderbrosik.github.io/secretary).
# The main site is https://getsecretary.vercel.app, built by Vercel from vercel.json; Google
# only accepts that one for app verification.
on:
  push:
    branches: [main]
    paths:
      - apps/web/src/legal/**
      - apps/web/scripts/build-legal-site.mjs
      - apps/web/public/favicon.svg
      - brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node apps/web/scripts/build-legal-site.mjs _site "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
